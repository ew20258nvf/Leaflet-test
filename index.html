<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>Leaflet Polar Weather Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #1a2634; /* 天気図らしいディープブルーの背景 */
        }
        .map-title {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px;
            font-family: sans-serif;
            border: 1px solid #334e68;
        }
    </style>
</head>
<body>

<div class="map-title">
    <strong style="font-size: 16px;">極射影（ポーラーステレオ）天気図</strong><br>
    <span style="font-size: 12px; color: #9fb3c8;">EPSG:3995 / グリッド自力描画版</span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.1/proj4leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-polylinedecorator/1.6.0/leaflet.polylineDecorator.min.js"></script>

<script>
    // 1. 北極ポーラーステレオ (EPSG:3995) の定義
    const crs = new L.Proj.CRS(
        'EPSG:3995',
        '+proj=stere +lat_0=90 +lat_ts=71 +lon_0=0 +k=1 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs',
        {
            resolutions: [16384, 8192, 4096, 2048, 1024, 512, 256, 128],
            origin: [-30000000, 30000000]
        }
    );

    // 2. 地図の初期化（日本付近を中心に設定）
    const map = L.map('map', {
        crs: crs,
        center: [40, 140], 
        zoom: 3,
        minZoom: 1,
        maxZoom: 6
    });

    // 3. 経緯線（グリッド）を自前で描画
    // 画像サーバーが死んでいても、これで北極を中心とした天気図の枠組みが絶対に見えます
    const gridOptions = { color: '#334e68', weight: 1, opacity: 0.6, fill: false, interactive: false };
    
    // 緯線（北緯20度〜80度まで10度刻みの同心円）
    for (let lat = 20; lat <= 80; lat += 10) {
        let coords = [];
        for (let lon = -180; lon <= 180; lon += 5) { coords.push([lat, lon]); }
        L.polygon(coords, gridOptions).addTo(map);
    }
    // 経線（15度刻みで放射状に伸びる線）
    for (let lon = -180; lon < 180; lon += 15) {
        L.polyline([[10, lon], [90, lon]], gridOptions).addTo(map);
    }

    // --- 天気図オブジェクトの描画 ---

    // A. 寒冷前線（青い線 ＋ 三角マーク）
    const coldFrontPoints = [[45, 150], [38, 143], [32, 138], [25, 132]];
    const coldLine = L.polyline(coldFrontPoints, { color: '#0070f3', weight: 4 }).addTo(map);
    
    L.polylineDecorator(coldLine, {
        patterns: [{
            offset: 25, repeat: 35,
            symbol: L.Symbol.path({
                path: 'M 0,0 L 8,-8 L 16,0 Z',
                pathOptions: { color: '#0070f3', fillColor: '#0070f3', fillOpacity: 1, weight: 1 }
            })
        }]
    }).addTo(map);

    // B. 温暖前線（赤い線 ＋ 半円マーク）
    const warmFrontPoints = [[45, 150], [48, 160], [49, 172], [47, 185]];
    const warmLine = L.polyline(warmFrontPoints, { color: '#ff0033', weight: 4 }).addTo(map);
    
    L.polylineDecorator(warmLine, {
        patterns: [{
            offset: 25, repeat: 35,
            symbol: L.Symbol.path({
                path: 'M 0,0 A 6,6 0 0,1 14,0 Z',
                pathOptions: { color: '#ff0033', fillColor: '#ff0033', fillOpacity: 1, weight: 1 }
            })
        }]
    }).addTo(map);

    // C. 低気圧（L）マーク
    const lowIcon = L.divIcon({
        html: '<div style="color: #ff0033; font-size: 28px; font-weight: bold; font-family: \'Arial Black\', sans-serif;">L</div>',
        className: 'weather-label', iconSize: [30, 30], iconAnchor: [15, 20]
    });
    L.marker([46, 149], { icon: lowIcon }).addTo(map).bindPopup('低気圧 (996 hPa)');

    // D. 高気圧（H）マーク
    const highIcon = L.divIcon({
        html: '<div style="color: #0070f3; font-size: 28px; font-weight: bold; font-family: \'Arial Black\', sans-serif;">H</div>',
        className: 'weather-label', iconSize: [30, 30], iconAnchor: [15, 20]
    });
    L.marker([33, 122], { icon: highIcon }).addTo(map).bindPopup('高気圧 (1018 hPa)');

</script>
</body>
</html>
