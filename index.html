<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>Leaflet Polar Simple Weather Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #1a2634; /* 背景が表示されていればこの色になります */
        }
        .map-title {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(0, 0, 0, 0.8); color: #fff; padding: 10px;
            border-radius: 6px; font-family: sans-serif; font-size: 14px;
        }
    </style>
</head>
<body>

<div class="map-title">極射影天気図（シンプル安全版）</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.1/proj4leaflet.min.js"></script>

<script>
    // 1. エラーを避けるため、念のためライブラリが存在するかチェック
    if (typeof L !== 'undefined' && typeof L.Proj !== 'undefined') {
        
        // 2. 北極ポーラーステレオ (EPSG:3995) の定義
        const crs = new L.Proj.CRS(
            'EPSG:3995',
            '+proj=stere +lat_0=90 +lat_ts=71 +lon_0=0 +k=1 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs',
            {
                resolutions: [16384, 8192, 4096, 2048, 1024, 512, 256, 128],
                origin: [-30000000, 30000000]
            }
        );

        // 3. 地図の初期化
        const map = L.map('map', {
            crs: crs,
            center: [40, 140], // 日本付近
            zoom: 3
        });

        // 4. シンプルな線で経緯線を描画（プラグイン不使用）
        const gridStyle = { color: '#334e68', weight: 1, fill: false };
        for (let lat = 20; lat <= 80; lat += 20) {
            let coords = [];
            for (let lon = -180; lon <= 180; lon += 10) { coords.push([lat, lon]); }
            L.polygon(coords, gridStyle).addTo(map);
        }

        // 5. 前線（まずはシンプルな太い赤・青の線として描画）
        // ※デコレータープラグインがエラーを起こす可能性を排除しました
        L.polyline([[45, 150], [38, 143], [32, 138]], { color: '#0070f3', weight: 5 }).addTo(map); // 寒冷
        L.polyline([[45, 150], [48, 160], [49, 172]], { color: '#ff0033', weight: 5 }).addTo(map); // 温暖

        // 6. 低気圧・高気圧マーク
        const lowIcon = L.divIcon({
            html: '<div style="color: #ff0033; font-size: 30px; font-weight: bold;">L</div>',
            className: 'weather-label', iconSize: [30, 30]
        });
        L.marker([46, 149], { icon: lowIcon }).addTo(map);

    } else {
        alert('ライブラリの読み込みに失敗している可能性があります。');
    }
</script>
</body>
</html>
